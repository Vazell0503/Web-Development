<!DOCTYPE html>
<html>
<head>
    <title>Latihan 5 - Bilangan Ganjil</title>
</head>
<body>
    <script>
        let batas = parseInt(prompt("Masukkan angka batas maksimal:"));
        document.write("<h3>Bilangan Ganjil dari 1 sampai " + batas + "</h3>");
        for (let i = 1; i <= batas; i += 2) {
            document.write(i + " ");
        }
    </script>
</body>
</html>
